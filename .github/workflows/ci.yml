name: Build json2cpp

on:
  workflow_dispatch:

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_CXX_COMPILER:FILEPATH=clang++ -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE:BOOL=ON -DCMAKE_CXX_FLAGS:STRING="-ffunction-sections -fdata-sections" -DCMAKE_EXE_LINKER_FLAGS_RELEASE:STRING="-Wl,--gc-sections -s" -Djson2cpp_PACKAGING_MAINTAINER_MODE:BOOL=ON -DGIT_SHA:STRING=${{ github.sha }}

      - name: Build
        run: cmake --build build --config Release

      - name: CPack TBZ2
        working-directory: build
        run: cpack -C Release -G TBZ2

      - name: CPack ZIP
        working-directory: build
        run: cpack -C Release -G ZIP

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: json2cpp-ubuntu
          path: |
            build/json2cpp-*-Release-*.tar.bz2
            build/json2cpp-*-Release-*.zip
          retention-days: 5

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE:BOOL=ON -DCMAKE_EXE_LINKER_FLAGS_RELEASE:STRING="-Wl,-dead_strip -Wl,-S -Wl,-x" -Djson2cpp_PACKAGING_MAINTAINER_MODE:BOOL=ON -DGIT_SHA:STRING=${{ github.sha }}

      - name: Build
        run: cmake --build build --config Release

      - name: CPack TBZ2
        working-directory: build
        run: cpack -C Release -G TBZ2

      - name: CPack ZIP
        working-directory: build
        run: cpack -C Release -G ZIP

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: json2cpp-macos
          path: |
            build/json2cpp-*-Release-*.tar.bz2
            build/json2cpp-*-Release-*.zip
          retention-days: 5

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_CXX_COMPILER:FILEPATH=cl -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE:BOOL=ON -DCMAKE_CXX_FLAGS_RELEASE:STRING="/O2 /Ob2 /DNDEBUG /Gy /Gw /wd4996" -DCMAKE_EXE_LINKER_FLAGS_RELEASE:STRING="/INCREMENTAL:NO /OPT:REF /OPT:ICF=5" -Djson2cpp_PACKAGING_MAINTAINER_MODE:BOOL=ON -DGIT_SHA:STRING=${{ github.sha }}

      - name: Build
        run: cmake --build build --config Release --verbose

      - name: CPack TBZ2
        working-directory: build
        run: cpack -C Release -G TBZ2

      - name: CPack ZIP
        working-directory: build
        run: cpack -C Release -G ZIP

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: json2cpp-windows
          path: |
            build/json2cpp-*-Release-*.tar.bz2
            build/json2cpp-*-Release-*.zip
          retention-days: 5

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: [build-ubuntu, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: json2cpp-builds

      - name: Publish Snapshot Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: snapshot-${{ github.sha }}
          files: |
            json2cpp-builds/json2cpp-*/json2cpp-*-Release-*.tar.bz2
            json2cpp-builds/json2cpp-*/json2cpp-*-Release-*.zip

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            json2cpp-builds/json2cpp-*/json2cpp-*-Release-*.tar.bz2
            json2cpp-builds/json2cpp-*/json2cpp-*-Release-*.zip

      - name: Cleanup repository
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
